<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="Img/Parking-Sign-Flat-Style.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="Css/style.css">
    <link rel="stylesheet" href="Css/responsive.css">
    <title>Parqueo Tu favorito</title>
</head>
<body>
    <header>
        <h1>Parqueo Tu Favorito</h1>
        <nav class="navbar">
            <div class="navbar-header">
                <h3>Menu</h3>
            </div>
            <ul>
                <li><a href="register-vehicle.html">Registrar Auto</a></li>
                <li><a href="records.html">Historial y registros</a></li>
                <li><a href="croquis.html">Croquis</a></li>
                <li><a href="index.html">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <form id="register-vehicle-type">
            <img src="https://cdn-icons-png.flaticon.com/128/768/768869.png" alt="Camión">
            <h2>Crear Tipo de Vehículo</h2>
            
            <label for="codigo">Codigo</label>
            <input type="text" id="code" name="code" placeholder="Ej: P01TF" required>
            
            <label for="nombre">Nombre del Tipo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Camión" required>
            
            <label for="precio">Tarifa por Hora (Q)</label>
            <input type="number" id="precio" name="precio" placeholder="Ej: 50" step="12" min="0" required>
            
            <button type="submit" id="btn-type">Crear</button>
        </form>
        <p id="message"></p>
    </main>
    <script src="JS/script.js"></script>
</body>
</html>
