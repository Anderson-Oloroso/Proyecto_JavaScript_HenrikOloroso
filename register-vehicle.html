<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="Img/Parking-Sign-Flat-Style.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="copyright" content="Anderson Oloroso © 2026">
    <meta http-equiv="refresh" content="10000">
    <meta name="description" content="Proyecto Final JS">
    <meta name="author" content="Anderson-Olororoso">
    <link rel="stylesheet" href="Css/style.css">
    <link rel="stylesheet" href="Css/responsive.css">
    <title>Parqueo Tu favorito</title>
</head>
<body>
    <header>
        <h1>Parqueo Tu Favorito</h1>
        <nav class="navbar">
            <div class="navbar-header">
                <h3>Menu</h3>
            </div>
            <ul>
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#registrar">Registrar Auto</a></li>
                <li><a href="#historial">Historial</a></li>
                <li><a href="#reportes">Reportes</a></li>
                <li><a href="#configuracion">Configuración</a></li>
                <li><a href="#salir">Salir</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <form action="submit" method="post" class="register-vehicle">
            <img src="https://cdn-icons-png.flaticon.com/128/3664/3664538.png" alt="Imagen auto">
            <h2>Registrar Auto</h2>
            
            <label for="placa">Placa del Vehículo</label>
            <input type="text" id="placa" name="placa" placeholder="Ej: ABC-1234" required>
            
            <label for="tipo">Tipo de Vehículo</label>
            <select id="tipo" name="tipo" required>
                <option value="">Selecciona un tipo</option>
                <option value="sedan">Sedán</option>
                <option value="suv">SUV</option>
                <option value="pickup">Pickup</option>
                <option value="moto">Motocicleta</option>
                <option value="otro">Otro</option>
            </select>
            
            <label for="slot">Slot (Espacio Asignado)</label>
            <input type="text" id="slot" name="slot" placeholder="Ej: A-05" required>
            
            <button type="submit" id="btn-login">Registrar</button>
        </form>

    </main>
    <footer></footer>
    <script src="JS/script.js">
    </script>
</body>
</html>
